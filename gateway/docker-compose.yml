services:
  opensms-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: opensms
      POSTGRES_USER: opensms
      POSTGRES_PASSWORD: ${OPENSMS_POSTGRES_PASSWORD}
    volumes:
      - opensms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensms -d opensms"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  opensms-gateway:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      opensms-postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opensms-postgres-data:
